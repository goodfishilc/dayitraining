<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大易輸入法部件打字練習網頁</title>
  <!-- Tailwind CSS 快速打造現代化 UI -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <div class="max-w-5xl mx-auto p-4 md:p-6">
    <!-- 標題欄與姓名輸入區 -->
    <header class="bg-white rounded-xl shadow-md p-6 mb-6 border-b-4 border-indigo-500 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="text-center md:text-left">
        <h1 class="text-3xl font-extrabold text-indigo-700 tracking-wide">大易輸入法 · 部件分類打字練習網頁</h1>
        <p class="text-slate-500 mt-1 text-sm">已連線 Google Sheets API · 支援成績與題目寫入 record 分頁</p>
      </div>
      <!-- 姓名輸入框 -->
      <div class="flex items-center gap-2 bg-slate-50 border border-slate-300 rounded-lg px-4 py-2">
        <label for="userName" class="text-sm font-bold text-slate-700 whitespace-nowrap">👤 姓名：</label>
        <input type="text" id="userName" placeholder="請輸入姓名" class="bg-white border border-slate-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-indigo-600 font-medium w-36">
      </div>
    </header>

    <!-- 部件類別勾選區 -->
    <section class="bg-white rounded-xl shadow-md p-6 mb-6">
      <h2 class="text-lg font-bold text-slate-700 mb-3 flex items-center gap-2">
        <span>📌</span> 選擇練習部件類別（可多選）：
      </h2>
      <div id="categoryFilters" class="flex flex-wrap gap-4">
        <label class="inline-flex items-center space-x-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50">
          <input type="checkbox" value="五行類" class="category-checkbox accent-indigo-600 rounded" checked>
          <span class="font-medium text-slate-700">五行類</span>
        </label>
        <label class="inline-flex items-center space-x-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50">
          <input type="checkbox" value="人類" class="category-checkbox accent-indigo-600 rounded" checked>
          <span class="font-medium text-slate-700">人類</span>
        </label>
        <label class="inline-flex items-center space-x-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50">
          <input type="checkbox" value="動物類" class="category-checkbox accent-indigo-600 rounded" checked>
          <span class="font-medium text-slate-700">動物類</span>
        </label>
        <label class="inline-flex items-center space-x-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50">
          <input type="checkbox" value="自然類" class="category-checkbox accent-indigo-600 rounded" checked>
          <span class="font-medium text-slate-700">自然類</span>
        </label>
        <label class="inline-flex items-center space-x-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50">
          <input type="checkbox" value="農業類" class="category-checkbox accent-indigo-600 rounded" checked>
          <span class="font-medium text-slate-700">農業類</span>
        </label>
        <label class="inline-flex items-center space-x-2 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200 cursor-pointer hover:bg-indigo-50">
          <input type="checkbox" value="工藝其他類" class="category-checkbox accent-indigo-600 rounded" checked>
          <span class="font-medium text-slate-700">工藝其他類</span>
        </label>
      </div>
    </section>

    <!-- 練習模式切換 Tab -->
    <div class="flex border-b border-slate-300 mb-6 gap-2">
      <button id="tabMode1" onclick="switchMode('mode1')" class="mode-tab py-3 px-6 font-bold text-indigo-600 border-b-4 border-indigo-600 bg-white rounded-t-lg shadow-sm">
        1. 部件熟練練習
      </button>
      <button id="tabMode2" onclick="switchMode('mode2')" class="mode-tab py-3 px-6 font-semibold text-slate-500 hover:text-indigo-600 rounded-t-lg">
        2. 文字拆解練習
      </button>
      <button id="tabMode3" onclick="switchMode('mode3')" class="mode-tab py-3 px-6 font-semibold text-slate-500 hover:text-indigo-600 rounded-t-lg">
        3. 文章打字練習
      </button>
    </div>

    <!-- 練習主區域 -->
    <main class="bg-white rounded-xl shadow-md p-8 min-h-[350px] relative">

      <!-- 統計數據與送出成績面板 -->
      <div class="flex flex-col sm:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-100 gap-4 text-sm md:text-base">
        <div class="flex gap-6">
          <span class="text-slate-500">正確數：<strong id="correctCount" class="text-emerald-600 text-lg">0</strong></span>
          <span class="text-slate-500">錯誤數：<strong id="wrongCount" class="text-rose-600 text-lg">0</strong></span>
          <span class="text-slate-500">正確率：<strong id="accuracy" class="text-indigo-600 text-lg">100%</strong></span>
        </div>
        <div class="flex gap-2">
          <button onclick="resetStats()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-600 px-3 py-1.5 rounded-md">重新統計</button>
          <button id="btnSubmitRecord" onclick="submitRecord()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-md shadow-sm transition">📤 送出成績至 record</button>
        </div>
      </div>

      <!-- 模式一：部件熟練練習 (支援圖片顯示) -->
      <div id="practiceMode1" class="mode-content text-center py-6">
        <div class="text-slate-400 text-sm mb-2">請按下對應的大易字根按鍵：</div>
        <div id="targetRadical" class="text-7xl font-extrabold text-indigo-600 my-4 h-28 flex items-center justify-center">
          <!-- 文字或 <img> 動態載入 -->
        </div>
        <div id="radicalHint" class="text-slate-500 text-base mb-6">資料載入中...</div>
        <div class="inline-block bg-indigo-50 border border-indigo-200 rounded-lg px-6 py-3 text-indigo-800 text-sm font-medium">
          💡 請直接敲擊鍵盤按鍵進行輸入
        </div>
      </div>

      <!-- 模式二：文字拆解練習 -->
      <div id="practiceMode2" class="mode-content hidden text-center py-6">
        <div class="text-slate-400 text-sm mb-2">請依序輸入該字的大易拆碼：</div>
        <div id="targetCharacter" class="text-7xl font-extrabold text-indigo-600 my-4">-</div>
        <div id="charBreakdown" class="text-slate-500 text-sm mb-4">拆解提示：-</div>
        <div id="charInputDisplay" class="text-2xl font-mono tracking-widest text-indigo-900 bg-slate-100 w-48 mx-auto py-2 rounded-lg border mb-4 h-12 flex items-center justify-center">
          -
        </div>
      </div>

      <!-- 模式三：文章打字練習 -->
      <div id="practiceMode3" class="mode-content hidden">
        <div class="mb-4">
          <label class="text-sm font-bold text-slate-600">選擇文章：</label>
          <select id="articleSelect" onchange="loadArticle()" class="border rounded-lg px-3 py-2 text-sm bg-slate-50">
            <!-- 動態載入文章 -->
          </select>
        </div>
        <div id="articleDisplay" class="text-2xl leading-relaxed tracking-wider font-serif bg-slate-50 p-6 rounded-lg border min-h-[120px] mb-4">
          <!-- 動態載入文章字元 -->
        </div>
        <input type="text" id="mode3Input" class="w-full border-2 border-indigo-300 rounded-lg p-3 text-lg focus:outline-none focus:border-indigo-600" placeholder="點擊此處開始打字..." autofocus>
      </div>

      <!-- 反饋訊息提示器 -->
      <div id="feedbackMsg" class="mt-4 text-center font-bold text-lg min-h-[28px]"></div>
    </main>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxxjVK9FG9oGAe0Tk5Odcrnf3MQDHQt5eB6tGwC2DbGz6aaGhwD2a7dm17hfrKV7UFy/exec";

    let dbData = { components: [], characters: [], articles: [] };
    let currentMode = 'mode1';
    let correctCount = 0;
    let wrongCount = 0;

    // 新增：儲存答對與答錯題目的清單陣列
    let correctItems = [];
    let wrongItems = [];

    let currentRadicalObj = null;
    let currentCharObj = null;
    let currentArticleText = '';
    let currentArticleIndex = 0;
    let mode2InputKeys = '';

    function extractDriveId(url) {
      if (!url) return null;
      const str = String(url).trim();
      const matches = str.match(/(?:file\/d\/|id=|open\?id=|\/d\/)([a-zA-Z0-9_-]{25,})/);
      return matches ? matches[1] : null;
    }

    function formatImageUrl(url) {
      if (!url) return '';
      let cleanUrl = String(url).trim();
      const driveId = extractDriveId(cleanUrl);
      if (driveId) {
        return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1000`;
      }
      return cleanUrl;
    }

    function isImageUrl(url) {
      if (!url) return false;
      const cleanUrl = String(url).trim().toLowerCase();
      return cleanUrl.startsWith('http://') || 
             cleanUrl.startsWith('https://') || 
             cleanUrl.startsWith('data:image/');
    }

    async function loadDatabase() {
      showFeedback('⏳ 正在載入 Google Sheets 資料庫...', 'indigo');
      try {
        const res = await fetch("https://script.google.com/macros/s/AKfycbxETeYDSIPZ9bHDT7tancCOB_0X_d6yALdojQt-0LPmug4aQfXS1TGs39EbRcA1WMaM/exec");
        const data = await res.json();
        if (data && data.components && data.components.length > 0) {
          dbData = data;
          showFeedback('✅ 資料庫載入成功！', 'emerald');
        } else {
          showFeedback('⚠️ 取得資料庫為空，請確認試算表內容', 'rose');
        }
      } catch (err) {
        console.warn("無法存取 API：", err);
        showFeedback('⚠️ 資料讀取失敗，請檢查 API 部署與權限', 'rose');
      }
      nextRadicalQuestion();
      loadArticles();
    }

    window.addEventListener('DOMContentLoaded', () => {
      setupEventListeners();
      loadDatabase();
    });

    function setupEventListeners() {
      document.querySelectorAll('.category-checkbox').forEach(cb => {
        cb.addEventListener('change', () => {
          if (currentMode === 'mode1') nextRadicalQuestion();
          if (currentMode === 'mode2') nextCharQuestion();
        });
      });

      document.addEventListener('keydown', (e) => {
        if (currentMode === 'mode1') {
          handleMode1KeyPress(e.key.toUpperCase());
        } else if (currentMode === 'mode2') {
          handleMode2KeyPress(e.key.toUpperCase());
        }
      });

      document.getElementById('mode3Input').addEventListener('input', (e) => {
        handleMode3Input(e.target.value);
      });
    }

    function getSelectedCategories() {
      const checkboxes = document.querySelectorAll('.category-checkbox:checked');
      return Array.from(checkboxes).map(cb => cb.value);
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(b => {
        b.classList.remove('border-b-4', 'border-indigo-600', 'text-indigo-600', 'font-bold');
        b.classList.add('text-slate-500', 'font-semibold');
      });
      document.querySelectorAll('.mode-content').forEach(c => c.classList.add('hidden'));

      if (mode === 'mode1') {
        document.getElementById('tabMode1').classList.add('border-b-4', 'border-indigo-600', 'text-indigo-600', 'font-bold');
        document.getElementById('practiceMode1').classList.remove('hidden');
        nextRadicalQuestion();
      } else if (mode === 'mode2') {
        document.getElementById('tabMode2').classList.add('border-b-4', 'border-indigo-600', 'text-indigo-600', 'font-bold');
        document.getElementById('practiceMode2').classList.remove('hidden');
        nextCharQuestion();
      } else if (mode === 'mode3') {
        document.getElementById('tabMode3').classList.add('border-b-4', 'border-indigo-600', 'text-indigo-600', 'font-bold');
        document.getElementById('practiceMode3').classList.remove('hidden');
        loadArticle();
      }
    }

    // --- 模式 1：部件熟練練習 ---
    function nextRadicalQuestion() {
      const selectedCats = getSelectedCategories();
      const filtered = dbData.components.filter(c => selectedCats.includes(String(c.Category)));
      const targetEl = document.getElementById('targetRadical');

      if (filtered.length === 0) {
        targetEl.innerText = '⚠️';
        document.getElementById('radicalHint').innerText = '請至少勾選一個部件類別';
        currentRadicalObj = null;
        return;
      }

      currentRadicalObj = filtered[Math.floor(Math.random() * filtered.length)];
      const rawRadical = String(currentRadicalObj.Radical || '');

      if (isImageUrl(rawRadical)) {
        const imgUrl = formatImageUrl(rawRadical);
        const driveId = extractDriveId(rawRadical);
        const fallbackUrl = driveId ? `https://lh3.googleusercontent.com/d/${driveId}` : '';

        targetEl.innerHTML = `
          <img src="${imgUrl}" 
               alt="部件圖片" 
               class="max-h-24 max-w-full object-contain mx-auto" 
               referrerpolicy="no-referrer"
               onerror="if('${fallbackUrl}' && this.src !== '${fallbackUrl}'){ this.src='${fallbackUrl}'; } else { this.onerror=null; this.parentNode.innerText='❌ 圖片載入失敗(請確認權限)'; }">
        `;
      } else {
        targetEl.innerText = rawRadical;
      }

      document.getElementById('radicalHint').innerText = `（提示：${currentRadicalObj.Hint || currentRadicalObj.Key + ' 鍵'}）`;
    }

    function handleMode1KeyPress(key) {
      if (!currentRadicalObj) return;

      const targetKey = String(currentRadicalObj.Key || '').trim().toUpperCase();
      const itemLabel = currentRadicalObj.Hint ? `${currentRadicalObj.Hint.split('：')[1] || currentRadicalObj.Radical}(${targetKey})` : `${currentRadicalObj.Radical}(${targetKey})`;

      if (key === targetKey) {
        showFeedback('✨ 正確！', 'emerald');
        correctCount++;
        correctItems.push(itemLabel);
        nextRadicalQuestion();
      } else if (/^[A-Z0-9;,.\/]$/.test(key)) {
        showFeedback(`❌ 錯誤！按鍵應為 ${targetKey}`, 'rose');
        wrongCount++;
        wrongItems.push(itemLabel);
      }
      updateStats();
    }

    // --- 模式 2：文字拆解練習 ---
    function nextCharQuestion() {
      const selectedCats = getSelectedCategories();
      const filtered = dbData.characters.filter(c => selectedCats.includes(String(c.Category)));

      if (filtered.length === 0) {
        document.getElementById('targetCharacter').innerText = '⚠️';
        document.getElementById('charBreakdown').innerText = '請至少勾選一個部件類別';
        currentCharObj = null;
        return;
      }

      currentCharObj = filtered[Math.floor(Math.random() * filtered.length)];
      document.getElementById('targetCharacter').innerText = currentCharObj.Character;
      document.getElementById('charBreakdown').innerText = `部件拆解：${currentCharObj.Breakdown || '無拆解提示'}`;
      mode2InputKeys = '';
      updateMode2Display();
    }

    function handleMode2KeyPress(key) {
      if (!currentCharObj) return;

      if (key === 'BACKSPACE') {
        mode2InputKeys = mode2InputKeys.slice(0, -1);
        updateMode2Display();
        return;
      }

      if (/^[A-Z0-9;,.\/]$/.test(key)) {
        mode2InputKeys += key;
        updateMode2Display();

        const targetKeys = String(currentCharObj.DayiKeys).trim().toUpperCase();
        const itemLabel = `${currentCharObj.Character}[${targetKeys}]`;

        if (mode2InputKeys === targetKeys) {
          showFeedback('🎉 拆解正確！', 'emerald');
          correctCount++;
          correctItems.push(itemLabel);
          setTimeout(nextCharQuestion, 800);
        } else if (!targetKeys.startsWith(mode2InputKeys)) {
          showFeedback(`❌ 拆解錯誤！正確為 ${targetKeys}`, 'rose');
          wrongCount++;
          wrongItems.push(itemLabel);
          mode2InputKeys = '';
          setTimeout(updateMode2Display, 1000);
        }
        updateStats();
      }
    }

    function updateMode2Display() {
      document.getElementById('charInputDisplay').innerText = mode2InputKeys || '-';
    }

    // --- 模式 3：文章打字練習 ---
    function loadArticles() {
      const select = document.getElementById('articleSelect');
      if (!dbData.articles || dbData.articles.length === 0) {
        select.innerHTML = '<option value="">無文章資料</option>';
        return;
      }
      select.innerHTML = dbData.articles.map(a => `<option value="${a.ID}">${a.Title || '文章 ' + a.ID}</option>`).join('');
      loadArticle();
    }

    function loadArticle() {
      const selectId = document.getElementById('articleSelect').value;
      const article = dbData.articles.find(a => a.ID == selectId) || dbData.articles[0];
      currentArticleText = article ? String(article.Content) : '';
      currentArticleIndex = 0;
      document.getElementById('mode3Input').value = '';
      renderArticleDisplay();
    }

    function renderArticleDisplay() {
      const container = document.getElementById('articleDisplay');
      let html = '';
      for (let i = 0; i < currentArticleText.length; i++) {
        if (i < currentArticleIndex) {
          html += `<span class="text-emerald-600 font-bold">${currentArticleText[i]}</span>`;
        } else if (i === currentArticleIndex) {
          html += `<span class="bg-indigo-200 text-indigo-900 font-bold underline px-1 rounded">${currentArticleText[i]}</span>`;
        } else {
          html += `<span class="text-slate-400">${currentArticleText[i]}</span>`;
        }
      }
      container.innerHTML = html;
    }

    function handleMode3Input(val) {
      if (!val) return;
      const inputChar = val.slice(-1);
      const targetChar = currentArticleText[currentArticleIndex];

      if (inputChar === targetChar) {
        correctCount++;
        correctItems.push(targetChar);
        currentArticleIndex++;
        if (currentArticleIndex >= currentArticleText.length) {
          showFeedback('🏆 完成文章打字！', 'emerald');
        }
      } else {
        wrongCount++;
        wrongItems.push(`錯打「${inputChar}」(原字：${targetChar})`);
        showFeedback(`錯字！應輸入：「${targetChar}」`, 'rose');
      }

      document.getElementById('mode3Input').value = '';
      updateStats();
      renderArticleDisplay();
    }

    // 送出成績至 Google Sheets 的 record 分頁
    async function submitRecord() {
      const userName = document.getElementById('userName').value.trim();
      if (!userName) {
        showFeedback('⚠️ 請先在右上角輸入姓名再送出成績！', 'rose');
        document.getElementById('userName').focus();
        return;
      }

      if (correctCount + wrongCount === 0) {
        showFeedback('⚠️ 目前尚無練習紀錄，請先開始答題！', 'rose');
        return;
      }

      const modeMap = {
        'mode1': '部件熟練練習',
        'mode2': '文字拆解練習',
        'mode3': '文章打字練習'
      };

      const payload = {
        name: userName,
        mode: modeMap[currentMode] || currentMode,
        accuracy: document.getElementById('accuracy').innerText,
        correctCount: correctCount,
        wrongCount: wrongCount,
        correctItems: correctItems,
        wrongItems: wrongItems
      };

      const btn = document.getElementById('btnSubmitRecord');
      btn.disabled = true;
      btn.innerText = '⏳ 送出中...';
      showFeedback('⏳ 正在儲存成績至 Google Sheets...', 'indigo');

      try {
        const res = await fetch("https://script.google.com/macros/s/AKfycbxETeYDSIPZ9bHDT7tancCOB_0X_d6yALdojQt-0LPmug4aQfXS1TGs39EbRcA1WMaM/exec", {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.status === 'success') {
          showFeedback('🎉 成績與答題紀錄已成功寫入 record 分頁！', 'emerald');
        } else {
          showFeedback('⚠️ 儲存失敗：' + result.message, 'rose');
        }
      } catch (err) {
        console.error("送出成績錯誤：", err);
        showFeedback('⚠️ 送出成績失敗，請確認 API 部署與權限', 'rose');
      } finally {
        btn.disabled = false;
        btn.innerText = '📤 送出成績至 record';
      }
    }

    function showFeedback(msg, color) {
      const el = document.getElementById('feedbackMsg');
      el.innerText = msg;
      el.className = `mt-4 text-center font-bold text-lg text-${color}-600`;
      setTimeout(() => { if (el.innerText === msg) el.innerText = ''; }, 2500);
    }

    function updateStats() {
      document.getElementById('correctCount').innerText = correctCount;
      document.getElementById('wrongCount').innerText = wrongCount;
      const total = correctCount + wrongCount;
      const acc = total === 0 ? 100 : Math.round((correctCount / total) * 100);
      document.getElementById('accuracy').innerText = `${acc}%`;
    }

    function resetStats() {
      correctCount = 0;
      wrongCount = 0;
      correctItems = [];
      wrongItems = [];
      updateStats();
    }
  </script>
</body>
</html>
